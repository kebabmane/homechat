name: Mobile + Server Contract CI

on:
  pull_request:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server_e2ee_contract:
    name: Server E2EE Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout server repo
        uses: actions/checkout@v5

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libavahi-compat-libdnssd-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run E2EE server contract tests
        run: |
          bin/rails test \
            test/controllers/api/v1/messages_controller_test.rb \
            test/controllers/api/v1/keys_controller_test.rb \
            test/controllers/api/v1/server_info_controller_test.rb \
            test/channels/chat_channel_test.rb \
            test/models/message_test.rb

  android_contract:
    name: Android E2EE Contract Tests
    runs-on: ubuntu-latest
    env:
      CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}

    steps:
      - name: Skip when cross-repo token is unavailable
        if: ${{ env.CROSS_REPO_PAT == '' }}
        run: echo "::notice::Skipping Android contract tests because CROSS_REPO_PAT is not configured."

      - name: Checkout Android repo
        if: ${{ env.CROSS_REPO_PAT != '' }}
        uses: actions/checkout@v5
        with:
          repository: kebabmane/homechat-android
          path: homechat-android
          token: ${{ env.CROSS_REPO_PAT }}

      - name: Set up Java
        if: ${{ env.CROSS_REPO_PAT != '' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Android contract tests
        if: ${{ env.CROSS_REPO_PAT != '' }}
        working-directory: homechat-android
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests "*MessageRepositoryImplTest" \
            --tests "*AuthViewModelTest" \
            --no-daemon

  ios_contract:
    name: iOS E2EE Contract Tests
    runs-on: macos-latest
    env:
      CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}

    steps:
      - name: Skip when cross-repo token is unavailable
        if: ${{ env.CROSS_REPO_PAT == '' }}
        run: echo "::notice::Skipping iOS contract tests because CROSS_REPO_PAT is not configured."

      - name: Checkout iOS repo
        if: ${{ env.CROSS_REPO_PAT != '' }}
        uses: actions/checkout@v5
        with:
          repository: kebabmane/homechat-ios
          path: homechat-ios
          token: ${{ env.CROSS_REPO_PAT }}

      - name: Show Xcode version
        if: ${{ env.CROSS_REPO_PAT != '' }}
        run: xcodebuild -version

      - name: Run iOS contract tests
        if: ${{ env.CROSS_REPO_PAT != '' }}
        working-directory: homechat-ios
        run: |
          xcodebuild \
            -project HomeChatIOS.xcodeproj \
            -scheme HomeChatIOS \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            test \
            -only-testing:HomeChatIOSTests/APIDecodeTests \
            -only-testing:HomeChatIOSTests/MessageModelTests \
            -only-testing:HomeChatIOSTests/E2EEServiceTests \
            -only-testing:HomeChatIOSTests/HmacServiceTests \
            -only-testing:HomeChatIOSTests/AppLockServiceTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
