name: API Contract Check

on:
  pull_request:
    paths:
      - "api-contracts/**"
      - "app/controllers/api/v1/**"
      - "app/models/**"
      - "config/routes.rb"
      - "scripts/generate-mobile-dtos.sh"
      - ".github/workflows/api-contract-check.yml"
  push:
    branches: [main]
    paths:
      - "api-contracts/**"
      - "app/controllers/api/v1/**"
      - "app/models/**"
      - "config/routes.rb"
      - "scripts/generate-mobile-dtos.sh"
      - ".github/workflows/api-contract-check.yml"
  workflow_dispatch:

jobs:
  validate_contract:
    name: Validate OpenAPI Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Rails repo
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Ensure JSON spec mirrors YAML spec
        run: |
          ruby -ryaml -rjson -e '
            yaml = YAML.safe_load_file("api-contracts/openapi.yaml", aliases: true)
            json = JSON.parse(File.read("api-contracts/openapi.json"))
            abort("api-contracts/openapi.json is stale; regenerate it from openapi.yaml") unless yaml == json
          '

      - name: Validate OpenAPI spec
        run: |
          docker run --rm \
            -v "${PWD}/api-contracts:/local" \
            openapitools/openapi-generator-cli:latest validate \
            -i /local/openapi.yaml

  generated_dto_drift:
    name: Check Mobile DTO Drift
    runs-on: ubuntu-latest
    needs: validate_contract

    steps:
      - name: Checkout Rails repo
        uses: actions/checkout@v4
        with:
          path: homechat

      - name: Verify cross-repo token is configured
        env:
          CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          if [ -z "$CROSS_REPO_PAT" ]; then
            echo "::error::CROSS_REPO_PAT is required so Rails CI can read the private Android and iOS repos."
            exit 1
          fi

      - name: Checkout Android repo
        uses: actions/checkout@v4
        with:
          repository: kebabmane/homechat-android
          path: homechat-android
          token: ${{ secrets.CROSS_REPO_PAT }}

      - name: Checkout iOS repo
        uses: actions/checkout@v4
        with:
          repository: kebabmane/homechat-ios
          path: homechat-ios
          token: ${{ secrets.CROSS_REPO_PAT }}

      - name: Regenerate mobile DTOs from contract
        working-directory: homechat
        run: ./scripts/generate-mobile-dtos.sh

      - name: Fail if Android generated DTOs drifted
        working-directory: homechat-android
        run: |
          git diff --exit-code -- \
            app/src/main/java/com/homechat/android/data/remote/generated

      - name: Fail if iOS generated DTOs drifted
        working-directory: homechat-ios
        run: |
          git diff --exit-code -- \
            HomeChatIOS/Core/Models/Generated
