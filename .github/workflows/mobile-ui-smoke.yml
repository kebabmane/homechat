name: iOS UI Smoke (Non-blocking)

on:
  pull_request:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios_ui_smoke:
    name: HomeChat iOS UI Smoke
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}

    steps:
      - name: Skip when cross-repo token is unavailable
        if: ${{ env.CROSS_REPO_PAT == '' }}
        run: echo "::notice::Skipping iOS UI smoke because CROSS_REPO_PAT is not configured."

      - name: Checkout iOS repo
        if: ${{ env.CROSS_REPO_PAT != '' }}
        uses: actions/checkout@v5
        with:
          repository: kebabmane/homechat-ios
          path: homechat-ios
          token: ${{ env.CROSS_REPO_PAT }}

      - name: Run HomeChat iOS UI tests (non-blocking)
        if: ${{ env.CROSS_REPO_PAT != '' }}
        working-directory: homechat-ios
        continue-on-error: true
        run: |
          mkdir -p TestResults
          xcodebuild \
            -project HomeChatIOS.xcodeproj \
            -scheme HomeChatIOS \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            test \
            -only-testing:HomeChatIOSUITests \
            -resultBundlePath TestResults/HomeChatIOSUI.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload iOS UI test results
        if: ${{ always() && env.CROSS_REPO_PAT != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: ios-ui-smoke-xcresult
          path: homechat-ios/TestResults/HomeChatIOSUI.xcresult
          if-no-files-found: ignore
