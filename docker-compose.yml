services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - rails_cache:/rails/tmp/cache
    environment:
      - RAILS_ENV=development
      - BUNDLE_PATH=/usr/local/bundle
      - TAILWIND_DISABLE_WATCHMAN=true
    command: ["bash", "-lc", "rm -f /rails/tmp/pids/server.pid && ./bin/dev"]
    tty: true
    stdin_open: true

volumes:
  bundle_cache:
  rails_cache:
